## Error Responses

All endpoints may return these error responses:

### 401 Unauthorized

```json
{
  "error": "Unauthorized",
  "message": "Invalid or expired token"
}
```

### 403 Forbidden

```json
{
  "error": "Forbidden",
  "message": "You do not have permission to access this resource"
}
```

### 404 Not Found

```json
{
  "error": "Not Found",
  "message": "Notification not found"
}
```

### 429 Too Many Requests

```json
{
  "error": "Too Many Requests",
  "message": "Rate limit exceeded. Please try again later.",
  "retry_after": 60
}
```

### 500 Internal Server Error

```json
{
  "error": "Internal Server Error",
  "message": "An unexpected error occurred",
  "request_id": "req_abc123"
}
```

---

## Rate Limits

| Endpoint | Limit | Window |
|----------|-------|--------|
| GET /notifications | 100/minute | Per user |
| PUT /notifications/*/read | 60/minute | Per user |
| POST /notifications/push/subscribe | 10/hour | Per user |
| Send push notification | 3/hour | Per user (urgent exempt) |
| Send email | 10/hour | Per user |

