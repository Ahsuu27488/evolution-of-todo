## 6. Notification Triggers (Internal)

These are called internally by the task system:

| Event | Type | Trigger |
|-------|------|---------|
| Task created | `task_assigned` | On task creation |
| Task due within 1 hour | `task_due` | Scheduled check |
| Task overdue | `task_overdue` | Scheduled check |
| Task completed | `task_completed` | On task completion |
| User reminder | `task_reminder` | User-scheduled time |

