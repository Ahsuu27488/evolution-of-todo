## 2. Push Notifications API

### 2.1 Subscribe to Push

**From**: FR-012, FR-018

```http
POST /api/notifications/push/subscribe
Authorization: Bearer <JWT_TOKEN>
Content-Type: application/json
```

**Request Body**:

```json
{
  "subscription": {
    "endpoint": "https://fcm.googleapis.com/fcm/send/...",
    "keys": {
      "p256dh": "BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcx...",
      "auth": "juarI8x__VnHvsOgfeAPHg"
    }
  },
  "device_info": {
    "user_agent": "Mozilla/5.0...",
    "platform": "web"
  }
}
```

**Response** (201 Created):

```json
{
  "id": "push_sub_123",
  "status": "subscribed"
}
```

---

### 2.2 Unsubscribe from Push

```http
DELETE /api/notifications/push/unsubscribe
Authorization: Bearer <JWT_TOKEN>
Content-Type: application/json
```

**Request Body**:

```json
{
  "endpoint": "https://fcm.googleapis.com/fcm/send/..."
}
```

**Response** (204 No Content)

---

### 2.3 Get Push Permission Status

**From**: FR-013

```http
GET /api/notifications/push/status
Authorization: Bearer <JWT_TOKEN>
```

**Response** (200 OK):

```json
{
  "status": "granted",
  "subscription_count": 2
}
```

**Status values**: `granted` | `denied` | `not_requested`

