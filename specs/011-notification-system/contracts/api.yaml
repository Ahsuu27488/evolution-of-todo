# API Contracts: Notification System

**Feature**: 011-notification-system
**Date**: 2026-01-27
**Source**: spec.md Functional Requirements

## Base URL

```
https://api.example.com/api/notifications
```

---

## 1. In-App Notifications API

### 1.1 List Notifications

**From**: FR-001, FR-009, FR-011

```http
GET /api/notifications
Authorization: Bearer <JWT_TOKEN>
```

**Query Parameters**:

| Parameter | Type | Default | Description |
|-----------|------|---------|-------------|
| `limit` | integer | 10 | Items per page (max 100) |
| `offset` | integer | 0 | Pagination offset |
| `unread_only` | boolean | false | Filter by unread status |

**Response** (200 OK):

```json
{
  "items": [
    {
      "id": "notif_123",
      "type": "task_due",
      "title": "Task Due Soon",
      "message": "Complete 'Buy groceries' within 1 hour",
      "data": {
        "task_id": "task_456",
        "due_at": "2026-01-27T14:00:00Z"
      },
      "read_status": false,
      "created_at": "2026-01-27T13:00:00Z",
      "related_task_id": "task_456"
    }
  ],
  "total": 25,
  "unread_count": 3
}
```

---

### 1.2 Mark Notification as Read

**From**: FR-005

```http
PUT /api/notifications/{notification_id}/read
Authorization: Bearer <JWT_TOKEN>
```

**Response** (200 OK):

```json
{
  "id": "notif_123",
  "read_status": true
}
```

**Error** (404 Not Found):

```json
{
  "error": "Notification not found"
}
```

---

### 1.3 Mark All as Read

**From**: FR-008

```http
POST /api/notifications/mark-all-read
Authorization: Bearer <JWT_TOKEN>
```

**Response** (200 OK):

```json
{
  "updated_count": 5
}
```

---

### 1.4 Delete Notification

**From**: FR-006

```http
DELETE /api/notifications/{notification_id}
Authorization: Bearer <JWT_TOKEN>
```

**Response** (204 No Content)

---

### 1.5 Notification Stream (SSE)

**From**: SC-001, SC-005

```http
GET /api/notifications/stream
Authorization: Bearer <JWT_TOKEN>
```

**Response**: `text/event-stream`

```
event: notification
data: {"id":"notif_123","type":"task_overdue","title":"Task Overdue","message":"Buy groceries is overdue","data":{"task_id":"task_456"}}
id: evt_001

event: notification_read_count
data: {"unread_count":2}
id: evt_002

: ping
```

