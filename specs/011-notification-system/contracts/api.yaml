## 5. Webhook (Resend)

### 5.1 Email Delivery Webhook

**From**: FR-025, FR-034

```http
POST /api/notifications/webhooks/resend
```

**Headers**:
```
svix-id: msg_123...
svix-timestamp: 1643723400
svix-signature: v1,abc123...
```

**Request Body** (examples):

```json
{
  "type": "email.bounced",
  "data": {
    "id": "email_123",
    "email": "user@example.com",
    "error": {
      "name": "invalid_domain",
      "message": "Domain does not exist"
    }
  }
}
```

**Response** (200 OK):

```json
{
  "received": true
}
```

**Actions on bounce**:
1. Mark email as invalid in user preferences
2. Disable email notifications for that user
3. Log bounce in `email_delivery_logs`

