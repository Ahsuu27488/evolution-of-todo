openapi: 3.1.0
info:
  title: Todo API - Authentication Endpoints
  description: API contracts for user authentication with first/last name support
  version: 2.0.0
  contact:
    name: Evolution of Todo Project

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.todo.example.com
    description: Production server

tags:
  - name: Authentication
    description: User signup, signin, and token management
  - name: Users
    description: User profile management

paths:
  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account with first name (required) and optional last name
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            examples:
              both_names:
                summary: User with both first and last name
                value:
                  email: john.doe@example.com
                  password: SecurePass123
                  firstName: John
                  lastName: Doe
              mononym:
                summary: User with only first name
                value:
                  email: madonna@example.com
                  password: SecurePass123
                  firstName: Madonna
                  lastName: null
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signin:
    post:
      tags:
        - Authentication
      summary: Sign in user
      description: Authenticate user and receive JWT token
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve profile of authenticated user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/token:
    get:
      tags:
        - Authentication
      summary: Get JWT token
      description: Exchange session cookie for JWT token (for frontend API client)
      operationId: getToken
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Token retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT access token
                  user:
                    $ref: '#/components/schemas/UserPublic'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve user profile by ID (admin or self only)
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  schemas:
    UserCreate:
      type: object
      required:
        - email
        - password
        - firstName
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: User email address (unique)
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: User password (will be hashed)
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: User's given name (required)
          example: John
        lastName:
          type: string
          maxLength: 50
          nullable: true
          description: User's family name (optional)
          example: Doe

    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          nullable: true
          maxLength: 50
          description: User's given name
        lastName:
          type: string
          nullable: true
          maxLength: 50
          description: User's family name
        displayName:
          type: string
          description: Computed display name (firstName + lastName or firstName or legacy name or email)
          example: John Doe
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          enum: [bearer]
        user:
          $ref: '#/components/schemas/UserPublic'

    ValidationError:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable validation error message
          example: First name is required
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: firstName
              message:
                type: string
                example: First name is required

    Error:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message
          example: Email already registered
