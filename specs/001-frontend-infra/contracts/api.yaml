openapi: 3.0.0
info:
  title: Chronos Todo API
  version: 2.0.0
  description: Backend API contracts for Phase II Full-Stack Web App

servers:
  - url: http://localhost:8000
    description: Development server

paths:
  /api/health:
    get:
      summary: Health check endpoint
      description: Check if the backend service is running
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 2.0.0

  /api/auth/signup:
    post:
      summary: Register new user
      description: Create a new user account with email and password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already registered

  /api/auth/signin:
    post:
      summary: Sign in user
      description: Authenticate with email and password, receive JWT token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Sign in successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /api/auth/signout:
    post:
      summary: Sign out user
      description: Client-side token invalidation (JWT is stateless)
      responses:
        '200':
          description: Sign out acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully signed out

  /api/auth/me:
    get:
      summary: Get current user
      description: Get information about the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/tasks:
    get:
      summary: List tasks
      description: Get all tasks for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, completed]
          description: Filter by completion status
        - name: priority
          in: query
          schema:
            type: string
            enum: [HIGH, MEDIUM, LOW]
          description: Filter by priority level
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
          description: Items per page
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
        '401':
          description: Unauthorized

    post:
      summary: Create task
      description: Create a new task for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /api/tasks/{taskId}:
    get:
      summary: Get task by ID
      description: Get a specific task (user must own the task)
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (task owned by different user)
        '404':
          description: Task not found

    put:
      summary: Update task
      description: Update an existing task (user must own the task)
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Task not found
        '422':
          description: Validation error

    delete:
      summary: Delete task
      description: Delete a task (user must own the task)
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Task not found

  /api/tasks/{taskId}/complete:
    patch:
      summary: Toggle task completion
      description: Toggle the completed status of a task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Task not found

  /api/tasks/search:
    get:
      summary: Search tasks
      description: Full-text search across task titles and descriptions
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
        '401':
          description: Unauthorized

  /api/tasks/{taskId}/logs:
    get:
      summary: Get task audit logs
      description: Get audit trail for a specific task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskLog'
        '401':
          description: Unauthorized
        '404':
          description: Task not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Better Auth, validated via BETTER_AUTH_SECRET

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: User identifier (email in current implementation)
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    Task:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          description: Owner of the task
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        completed:
          type: boolean
        tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              color:
                type: string
        due_date:
          type: string
          format: date-time
          nullable: true
        recurrence_pattern:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
          nullable: true
        transcription_text:
          type: string
          nullable: true
        ai_summary:
          type: string
          nullable: true
        embedding_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        tags:
          type: array
          items:
            type: object
        due_date:
          type: string
          format: date-time
        recurrence_pattern:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        completed:
          type: boolean
        tags:
          type: array
          items:
            type: object
        due_date:
          type: string
          format: date-time

    TaskLog:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: string
        action:
          type: string
          enum: [created, updated, deleted, completed, uncompleted]
        changed_fields:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
