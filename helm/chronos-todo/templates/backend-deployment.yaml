{{- if .Values.backend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chronos-todo.fullname" . }}-backend
  labels:
    {{- include "chronos-todo.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "chronos-todo.backend.labels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        dapr.io/enabled: "{{ .Values.backend.dapr.enabled }}"
        dapr.io/app-id: "{{ .Values.backend.dapr.appId }}"
        dapr.io/app-port: "{{ .Values.backend.service.port }}"
        dapr.io/http-port: "{{ .Values.backend.dapr.httpPort }}"
        dapr.io/grpc-port: "{{ .Values.backend.dapr.grpcPort }}"
        dapr.io/log-level: "{{ .Values.backend.dapr.logLevel }}"
        dapr.io/config: "chronos-dapr-config"
        dapr.io/sidecar-cpu-limit: "0.5"
        dapr.io/sidecar-cpu-request: "0.1"
        dapr.io/sidecar-memory-limit: "512Mi"
        dapr.io/sidecar-memory-request: "128Mi"
      labels:
        {{- include "chronos-todo.backend.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.port }}
          protocol: TCP
        {{- if .Values.backend.env }}
        env:
        {{- toYaml .Values.backend.env | nindent 8 }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: chronos-config
        - secretRef:
            name: chronos-secrets
        env:
        {{- if .Values.backend.dapr.enabled }}
        - name: DAPR_HTTP_PORT
          value: "{{ .Values.backend.dapr.httpPort }}"
        - name: DAPR_GRPC_PORT
          value: "{{ .Values.backend.dapr.grpcPort }}"
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.backend.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.backend.readinessProbe | nindent 10 }}
{{- end }}
