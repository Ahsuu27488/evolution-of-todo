{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chronos-todo.fullname" . }}-backend
  labels:
    {{- include "chronos-todo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "chronos-todo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "chronos-todo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://{{ .Values.global.neon.user }}:{{ .Values.global.neon.dbPassword }}@{{ .Values.global.neon.host | lower }}/{{ .Values.global.neon.database | lower }}?sslmode={{ .Values.global.neon.sslmode }}"
        - name: BETTER_AUTH_SECRET
          value: {{ .Values.global.betterAuth.secret | quote }}
        - name: OPENAI_API_KEY
          value: {{ .Values.global.openai.apiKey | quote }}
        - name: QDRANT_URL
          value: {{ .Values.global.qdrant.url | quote }}
        - name: QDRANT_API_KEY
          value: {{ .Values.global.qdrant.apiKey | quote }}
        - name: RESEND_API_KEY
          value: {{ .Values.global.resend.apiKey | quote }}
        - name: RESEND_FROM_EMAIL
          value: {{ .Values.global.resend.from | quote }}
        - name: VAPID_PUBLIC_KEY
          value: {{ .Values.global.vapid.publicKey | quote }}
        - name: VAPID_PRIVATE_KEY
          value: {{ .Values.global.vapid.privateKey | quote }}
        - name: CORS_ORIGINS
          value: {{ .Values.global.corsOrigins | quote }}
        - name: FRONTEND_URL
          value: {{ .Values.global.betterAuth.url | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.backend.env.LOG_LEVEL | quote }}
        {{- if .Values.backend.env.DEBUG }}
        - name: DEBUG
          value: {{ .Values.backend.env.DEBUG | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
{{- end }}
