{{- if .Values.frontend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos-todo.fullname" . }}-frontend
  labels:
    {{- include "chronos-todo.frontend.labels" . | nindent 4 }}
  {{- if and .Values.oracle.enabled .Values.oracle.loadBalancerAnnotations }}
  annotations:
    {{- toYaml .Values.oracle.loadBalancerAnnotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
