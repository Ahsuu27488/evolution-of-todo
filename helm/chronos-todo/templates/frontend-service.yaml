{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos-todo.fullname" . }}-frontend
  labels:
    {{- include "chronos-todo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - name: http
    port: {{ .Values.frontend.service.port }}
    targetPort: 3000
    protocol: TCP
  selector:
    {{- include "chronos-todo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
