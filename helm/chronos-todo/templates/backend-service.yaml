{{- if .Values.backend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos-todo.fullname" . }}-backend
  labels:
    {{- include "chronos-todo.backend.labels" . | nindent 4 }}
  {{- if and .Values.oracle.enabled .Values.oracle.loadBalancerAnnotations }}
  annotations:
    {{- toYaml .Values.oracle.loadBalancerAnnotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.backend.dapr.httpPort }}
    targetPort: {{ .Values.backend.dapr.httpPort }}
    protocol: TCP
    name: dapr-http
  selector:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
