apiVersion: v1
kind: Secret
metadata:
  name: chronos-secrets
  labels:
    {{- include "chronos-todo.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database URL (Neon - external cloud)
  # Format: postgresql+asyncpg://user:password@host:port/database?sslmode=require
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.global.neon.user }}:{{ .Values.global.neon.password }}@{{ .Values.global.neon.host }}:{{ .Values.global.neon.port }}/{{ .Values.global.neon.database }}?sslmode={{ .Values.global.neon.sslmode }}"

  # Better Auth Secret (shared between frontend and backend)
  BETTER_AUTH_SECRET: "mlHt/eQkNbw8oSExN56WdGS0dxwBdNGtMtG0XJ7jveE="

  # OpenAI API Key
  OPENAI_API_KEY: "{{ .Values.global.openai.apiKey }}"

  # Qdrant API Key
  QDRANT_API_KEY: "{{ .Values.global.qdrant.apiKey }}"

  # Resend API Key
  RESEND_API_KEY: "{{ .Values.global.resend.apiKey }}"
  RESEND_WEBHOOK_SECRET: "{{ .Values.global.resend.webhookSecret }}"

  # VAPID Keys (Push Notifications)
  VAPID_PUBLIC_KEY: "BLnlI3_WvJ6cDbDuyen07L4GOcqxPZFAoJJ4z48mvaK3VC2XMSylx6xlTTUTFWTuMyvIoVMZRe43PHubaZXEysY"
  VAPID_PRIVATE_KEY: "J4fh6gilYWT5RXJdm211piusPnlRsVVF2-vqwS3yGpA"
