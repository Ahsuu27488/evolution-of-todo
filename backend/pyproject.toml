[project]
name = "todo-backend"
version = "2.0.0"
description = "FastAPI backend for Phase II Chronos Todo Full-Stack Web Application"
readme = "README.md"
requires-python = ">=3.13"
# Keep in sync with requirements.txt (Docker and Hugging Face install from that file).
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Database ORM with async support (greenlet comes with the asyncio extra)
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Environment variables
    "python-dotenv>=1.0.0",
    # JWT verification and password hashing (bcrypt 3.x for passlib 1.7.4)
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt==3.2.2",
    # Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP clients
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "aiofiles>=24.1.0",
    # Notifications
    "pywebpush>=2.2.0",
    "resend>=2.21.0",
    "svix>=1.35.0",
    "sse-starlette>=3.2.0",
    # Phase III AI chatbot (majors pinned to what the code was written against)
    "openai-agents>=0.8,<0.9",
    "openai>=2.16,<3",
    "mcp>=1.25,<2",
    "qdrant-client>=1.12.0",
    "structlog>=24.1.0",
    "langdetect>=1.0.9",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
