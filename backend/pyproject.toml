[project]
name = "todo-backend"
version = "2.0.0"
description = "FastAPI backend for Phase II Chronos Todo Full-Stack Web Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Database ORM with async support
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29.0",
    # Environment variables
    "python-dotenv>=1.0.0",
    # JWT verification
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP client
    "httpx>=0.26.0",
    "pywebpush>=2.2.0",
    "resend>=2.21.0",
    "sse-starlette>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
