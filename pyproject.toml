[project]
name = "todo-console"
version = "1.0.0"
description = "Phase 1 - In-Memory Todo Console Application (Basic + Intermediate Features)"
requires-python = ">=3.13"
dependencies = []
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
todo = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo"]
